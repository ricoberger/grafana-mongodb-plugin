apiVersion: 1

datasources:
  - name: MongoDB
    type: ricoberger-mongodb-datasource
    uid: mongodb
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    jsonData:
      hosts: host.docker.internal
      port: 27017
      database: backend
      username: readonly
      connectionOptions: replicaSet=rs0&directConnection=true&authSource=admin
    secureJsonData:
      password: ${MONGODB_PASSWORD}
